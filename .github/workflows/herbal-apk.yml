name: Build My Herbal PK APK

on:
  push:
    branches: [main]
    paths:
      - 'android-herbal/**'
      - '.github/workflows/herbal-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HERBAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/herbal-release.jks"
            echo "HERBAL_KEYSTORE_PATH=$RUNNER_TEMP/herbal-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::HERBAL_KEYSTORE_BASE64 secret not set; signing with a debug key"
          fi

      - name: Build release APK
        working-directory: android-herbal
        env:
          VERSION_CODE: ${{ github.run_number }}
          HERBAL_KEYSTORE_PASSWORD: ${{ secrets.HERBAL_KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../MyHerbalPK.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: herbal-apk-${{ github.run_number }}
          name: My Herbal PK — Android ${{ github.run_number }}
          body: My Herbal PK کی Android ایپ (APK)۔
          make_latest: true
          files: MyHerbalPK.apk
