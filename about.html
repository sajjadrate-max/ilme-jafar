var PAGE_CONTENT = {
  en: "<p>ilmejafar.com is a free, online spiritual guidance platform built around the traditional Islamic discipline of Ilm-e-Jafar — a centuries-old practice that uses the numerical values of Arabic letters (abjad) to reflect on questions, names, and life circumstances. Our goal is simple: to take a body of knowledge that has historically been passed down through spiritual teachers, handwritten manuscripts, and rare books, and make it easily accessible to anyone with a smartphone, in their own language, at no cost.</p>\n\n  <h2>What Is Ilm-e-Jafar?</h2>\n  <p>Ilm-e-Jafar is a traditional Islamic spiritual science in which the letters of the Arabic alphabet — and the words formed from them — are analyzed through a numerical system known as abjad. Each letter carries a fixed numeric value, and by adding, arranging, or dividing these values in specific traditional ways, practitioners derive spiritual insight into a question or situation. The practice is traditionally associated with Imam Jafar as-Sadiq, from whom it takes its name, though the historical details of this association are a matter of ongoing discussion among scholars of Islamic spiritual history.</p>\n\n  <h3>Ilm-e-Jafar Akhbar</h3>\n  <p>This is the oldest method offered on our platform. A user's question is arranged into a staircase-shaped table known as a \"Jafar grid.\" Specific letters are then extracted from this grid according to a fixed traditional pattern, and these letters — along with their accumulated abjad value — form the basis of a direct, detailed answer to the question asked, along with a suggested wazifa (devotional recitation) where appropriate.</p>\n\n  <h3>Ilm-e-Jafar Aasar</h3>\n  <p>This method takes the abjad values of the questioner's name, their mother's name, the day of the question, and the question itself, and adds them together. The resulting total is then divided by a specific number — we currently offer division by 3, 4, 5, 6, 7, 8, 9, 10, 12, and 28 — with each divisor traditionally associated with a different kind of insight: the nature of a problem, its severity, its current stage, the likelihood of receiving help, a relevant day or time, the direction of one's fortune, one's spiritual state, the outcome of an effort, the general character of a matter, or — in the case of division by 28, corresponding to the 28 letters of the Arabic alphabet — the most detailed analysis we offer.</p>\n\n  <h3>Ism-e-Azam Finder</h3>\n  <p>Our Ism-e-Azam tool uses the abjad value of a person's name to identify which of Allah's beautiful names (Asma-ul-Husna) holds the closest traditional correspondence to that individual, along with guidance on reciting its associated wazifa — commonly sought for protection from black magic, jinn, enmity, and general life difficulties.</p>\n\n  <h3>Name Compatibility (Rishta/Marriage Matching)</h3>\n  <p>This tool compares the abjad values of two names — for example, a prospective bride and groom, or business partners — to offer a traditional analysis of how compatible a relationship or partnership may be.</p>\n\n  <h3>Baby Name Guidance</h3>\n  <p>We also offer two simple tools for new parents: one to check the meaning and suitability of a name they are considering for their child, and another to suggest good, meaningful names that complement a parent's own name.</p>\n\n  <h2>How Our Platform Works</h2>\n  <p>Every tool on ilmejafar.com follows the same basic principle: you provide a name, a question, or both, and our system performs the traditional abjad calculations described above. The detailed spiritual interpretation and suggested wazifa are then generated using an AI language model, which has been guided to respond within the traditional framework of Ilm-e-Jafar, in a respectful and Islamically-grounded tone, and strictly in the language you have selected.</p>\n\n  <p>We do not require account creation, email verification, or any payment. You can use every tool on this site immediately and free of charge. To keep the service running smoothly for everyone and to prevent excessive automated use, each tool has a fair daily usage allowance per device.</p>\n\n  <h2>Why We Built This Site</h2>\n  <p>Ilm-e-Jafar has traditionally been the domain of a small number of spiritual teachers, often accessible only to those who could travel to consult them in person, or who had access to rare, handwritten reference books passed down through generations. We believed that with the right care, this centuries-old tradition could be brought into the modern era — digitized, translated, and made available instantly to anyone, anywhere, on any device, without losing the respect and seriousness the tradition deserves.</p>\n\n  <p>That is why ilmejafar.com is available in four languages — Urdu, English, Hindi, and Arabic — so that speakers of each language can engage with this tradition comfortably in their own tongue, rather than being limited to a single language of access.</p>\n\n  <h2>Our Approach to Faith and Responsibility</h2>\n  <p>We take seriously the Islamic teaching that ultimate knowledge of the unseen belongs to Allah alone. Every tool on our platform is framed as a traditional means of reflection and guidance — never as a certain or guaranteed prediction of the future. We consistently encourage users to approach every question with sincere intention, to perform ablution (wudu) before asking, to recite Durood Shareef, and to hold complete trust in Allah above any specific tool or method.</p>\n\n  <p>We also want to be clear that ilmejafar.com does not replace professional medical, legal, financial, or psychological advice. For matters of physical or mental health, we always recommend consulting a qualified doctor. For matters of magic, jinn, or serious spiritual concern, we recommend consulting a knowledgeable, trustworthy religious scholar rather than relying solely on an online tool.</p>\n\n  <h2>How the Site Sustains Itself</h2>\n  <p>ilmejafar.com is supported by advertising (Google AdSense) displayed on the site. This allows us to keep every tool completely free for users, with no subscriptions, no paywalls, and no hidden charges. We do not sell user data, and we do not require any personal information beyond what a user chooses to type into a question field for the purpose of generating their result.</p>\n\n  <h2>Frequently Asked Questions</h2>\n  <h3>Do I need to create an account to use ilmejafar.com?</h3>\n  <p>No. Every tool on the site is available immediately, without registration, email verification, or any personal account. You simply enter the requested name or question and receive your result right away.</p>\n\n  <h3>Is ilmejafar.com really free?</h3>\n  <p>Yes. All of our tools — Ilm-e-Jafar Akhbar, Ilm-e-Jafar Aasar, Ism-e-Azam, name compatibility, and baby name guidance — are completely free to use. The site is supported through advertising rather than user fees.</p>\n\n  <h3>Why is there a daily limit on each tool?</h3>\n  <p>Generating each detailed spiritual analysis relies on an AI service that has a real operating cost. A fair daily allowance per device allows us to keep every tool free and available to as many people as possible, rather than a small number of users exhausting the service for everyone else.</p>\n\n  <h3>Will the same question always give the same result?</h3>\n  <p>Since the underlying calculation is based on fixed abjad values, the same name, day, and question will always produce the same numerical basis for the answer. The written explanation may vary slightly in wording each time, but the core numerical analysis remains consistent.</p>\n\n  <h3>Which languages does the site support?</h3>\n  <p>ilmejafar.com is currently available in Urdu, English, Hindi, and Arabic. You can switch languages at any time using the language selector at the top of the site.</p>\n\n  <h2>Get in Touch</h2>\n  <p>If you have questions, feedback, or suggestions for new features, we would love to hear from you through our <a href=\"/contact.html\" style=\"color:var(--gold);\">Contact page</a>. We continually look for ways to improve the platform, add new traditional methods, and make the experience smoother for our growing community of users across Pakistan, India, the Middle East, and beyond.</p>\n\n  <p>Thank you for visiting ilmejafar.com, and we pray that whatever guidance you seek here brings you closer to clarity, peace of mind, and — above all — closer to Allah.</p>",
  ur: "<h2>📿 علم جعفر کے بارے میں</h2>\n<p>ilmejafar.com ایک مفت، آن لائن روحانی رہنمائی کی ویب سائٹ ہے جو روایتی اسلامی علم جعفر پر مبنی ہے — یہ صدیوں پرانا علم عربی حروف کے ابجد اعداد کے ذریعے سوالات، ناموں اور زندگی کے معاملات پر روحانی غور و فکر کا ذریعہ ہے۔ ہمارا مقصد یہ ہے کہ جو علم پہلے صرف روحانی اساتذہ یا نایاب کتابوں تک محدود تھا، اب اسے ہر عام آدمی تک، اس کی اپنی زبان میں، بالکل مفت پہنچایا جائے۔</p>\n\n<h3>علم جعفر کیا ہے؟</h3>\n<p>علم جعفر ایک روایتی اسلامی روحانی علم ہے جس میں عربی حروف اور ان سے بننے والے الفاظ کا ابجد نظام کے ذریعے تجزیہ کیا جاتا ہے۔ ہر حرف کی ایک مقررہ عددی قدر ہے، اور انہی اعداد کو مخصوص روایتی طریقوں سے جمع، ترتیب یا تقسیم کر کے روحانی رہنمائی حاصل کی جاتی ہے۔ یہ علم روایتی طور پر امام جعفر صادق سے منسوب کیا جاتا ہے، اگرچہ اس نسبت کی تاریخی تفصیلات پر مختلف آراء پائی جاتی ہیں۔</p>\n\n<h3>📜 علم جعفر اخبار</h3>\n<p>یہ ہماری سائٹ کا سب سے قدیم طریقہ ہے۔ صارف کے سوال کے حروف کو ایک سیڑھی نما \"جعفر گرڈ\" میں ترتیب دیا جاتا ہے، پھر ایک مخصوص ترتیب سے حروف نکالے جاتے ہیں، اور انہی حروف کی روشنی میں سوال کا براہ راست اور تفصیلی جواب دیا جاتا ہے، ساتھ ہی مناسب وظیفہ بھی تجویز کیا جاتا ہے۔</p>\n\n<h3>🔢 علم جعفر آثار</h3>\n<p>اس طریقے میں سائل کا نام، والدہ کا نام، دن اور سوال کے ابجد اعداد جمع کیے جاتے ہیں، پھر مجموعے کو ایک مخصوص عدد پر تقسیم کیا جاتا ہے۔ ہم فی الحال 3، 4، 5، 6، 7، 8، 9، 10، 12 اور 28 پر تقسیم کی سہولت فراہم کرتے ہیں — ہر تقسیم مسئلے کی نوعیت، شدت، مرحلہ، مدد کا امکان، دن یا وقت، قسمت کا رخ، روحانی حالت، کوشش کا نتیجہ، عمومی مزاج، یا (28 کی صورت میں، جو عربی کے 28 حروف سے مطابقت رکھتی ہے) سب سے تفصیلی تجزیہ فراہم کرتی ہے۔</p>\n\n<h3>✨ اسم اعظم فائنڈر</h3>\n<p>یہ ٹول کسی شخص کے نام کے ابجد اعداد کی روشنی میں یہ بتاتا ہے کہ اللہ تعالیٰ کے کون سے اسمِ حسنیٰ سے اس کی سب سے زیادہ مناسبت ہے، ساتھ ہی اس کے وظیفے کی رہنمائی بھی فراہم کرتا ہے — جو عام طور پر جادو، جنات، دشمنی اور عمومی مشکلات سے حفاظت کے لیے استعمال ہوتا ہے۔</p>\n\n<h3>💑 نام کی مناسبت (رشتہ/شادی)</h3>\n<p>یہ ٹول دو ناموں — مثلاً ممکنہ دولہا دلہن یا کاروباری شراکت function switchPageLang(code){
  if(!PAGE_CONTENT[code]) code = 'en';
  localStorage.setItem('ilmLang', code);
  document.getElementById('pageContent').innerHTML = PAGE_CONTENT[code];
  document.documentElement.setAttribute('dir', (code === 'ur' || code === 'ar') ? 'rtl' : 'ltr');
  document.getElementById('langSelectPage').value = code;
}

(function(){

})();
