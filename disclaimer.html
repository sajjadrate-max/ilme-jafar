function switchPageLang(code){
  if(!PAGE_CONTENT[code]) code = 'en';
  localStorage.setItem('ilmLang', code);
  document.getElementById('pageContent').innerHTML = PAGE_CONTENT[code];
  document.documentElement.setAttribute('dir', (code === 'ur' || code === 'ar') ? 'rtl' : 'ltr');
  document.getElementById('langSelectPage').value = code;
}

(function(){
  var saved = localStorage.getItem('ilmLang') || 'en';
  if(!PAGE_CONTENT[saved]) saved = 'en';
  switchPageLang(saved);
})();
