<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>مریضوں کا کھاتہ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d5b4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مریض کھاتہ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="khata-icon-192.png">
<link rel="apple-touch-icon" href="khata-icon-512-maskable.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: ایک کالم، اوپر ٹیب، نیچے کارڈ — دواخانے کے رجسٹر جیسا */
:root{
  --bg:#f3f1ea; --paper:#fffdf7; --ink:#1f2a27; --muted:#5f6b66; --line:#dcd7c8;
  --accent:#1d5b4f; --accent-soft:#e1ece7; --saffron:#b8761a;
  --good:#2f7d3e; --good-bg:#e3f1e4; --mid:#9a6a08; --mid-bg:#f7ecd3;
  --bad:#a63a2f; --bad-bg:#f6e1dd; --idle:#5f6b66; --idle-bg:#e9e7e0;
  --title:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;
  --body:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;
  --shadow:0 1px 2px rgba(30,40,35,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a18; --paper:#1c2421; --ink:#e8ece9; --muted:#9aa8a2; --line:#2f3a36;
  --accent:#6cc3ad; --accent-soft:#21332e; --saffron:#e3a54a;
  --good:#7fd08c; --good-bg:#1f3323; --mid:#e8bd5c; --mid-bg:#352c16;
  --bad:#f08a7d; --bad-bg:#3a201c; --idle:#a9b4af; --idle-bg:#262e2b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a18; --paper:#1c2421; --ink:#e8ece9; --muted:#9aa8a2; --line:#2f3a36;
  --accent:#6cc3ad; --accent-soft:#21332e; --saffron:#e3a54a;
  --good:#7fd08c; --good-bg:#1f3323; --mid:#e8bd5c; --mid-bg:#352c16;
  --bad:#f08a7d; --bad-bg:#3a201c; --idle:#a9b4af; --idle-bg:#262e2b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.8;direction:rtl}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:12px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px}
h1{font-family:var(--title);font-size:1.7rem;margin:0;line-height:2.2;color:var(--accent)}
.sub{color:var(--muted);font-size:.9rem;margin:0}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:14px}
nav.tabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 4px;cursor:pointer;font-size:.95rem}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
button,input,select,textarea{font:inherit}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--paper);border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:2px 10px;font-size:.88rem}
.btn:focus-visible,nav.tabs button:focus-visible,.row:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:0}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 10px}
textarea{min-height:70px;resize:vertical}
label{display:flex;flex-direction:column;gap:2px;font-weight:600;font-size:.92rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;box-shadow:var(--shadow)}
.row .main{min-width:0}
.row .name{font-weight:700;font-size:1.05rem}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px 4px;box-shadow:var(--shadow)}
.pcard summary{list-style:none;cursor:pointer}
.pcard summary::-webkit-details-marker{display:none}
.pcard summary:focus-visible{outline:3px solid var(--saffron);outline-offset:4px;border-radius:8px}
.pcard .line{font-size:.97rem;overflow-wrap:anywhere;margin-top:2px;white-space:pre-line}
.pcard .lbl{color:var(--muted);font-weight:700}
.pcard .pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 10px;font-size:.88rem;font-weight:700;margin:2px 0}
.pcard .tri{display:flex;justify-content:center;margin-top:4px}
.pcard .tri span{display:inline-flex;align-items:center;justify-content:center;width:44px;height:30px;border-radius:999px;background:var(--accent);color:var(--paper);font-size:.9rem;transition:transform .2s}
.pcard[open] .tri span{transform:rotate(180deg)}
.pcard .more{border-top:1px dashed var(--line);margin-top:6px;padding-block:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pcard .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard .pname{font-family:var(--title);font-size:1.75rem;line-height:2.1;color:var(--accent);font-weight:700;overflow-wrap:anywhere}
.pcard .head .chip{margin-top:12px}
.pcard .pname .sample{font-family:var(--body);font-size:.75rem;font-weight:400;vertical-align:middle}
.pcard dl.info{font-size:.95rem}
.pcard .sec{margin-top:8px;font-weight:700;color:var(--muted);font-size:.88rem}
.pcard .med{border-inline-start:3px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:4px 10px;margin-top:4px;font-size:.93rem;overflow-wrap:anywhere}
.pcard .med .meta{color:var(--muted);font-size:.85rem}
.pcard .fu{margin-top:4px;font-size:.93rem;overflow-wrap:anywhere}
.medsBtn{width:100%;margin-bottom:12px}
.picker{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.picker .lbl2{font-weight:700;color:var(--accent)}
.pk-row{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.pk-name{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pk-name .x{background:none;border:0;color:var(--bad);font-size:1.4rem;line-height:1;cursor:pointer;padding:0 4px}
.pk-calc{display:grid;grid-template-columns:1fr auto 1fr auto auto;gap:6px;align-items:end;font-variant-numeric:tabular-nums}
.pk-calc label{font-size:.8rem}
.pk-calc span{padding-bottom:8px;color:var(--muted)}
.pk-calc .pk-line{padding-bottom:8px;white-space:nowrap}
.pk-sched{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0 2px}
.pk-sched label{font-size:.78rem}
.pk-sched select{width:100%;padding:6px 4px}
.pk-sum{font-size:.85rem;color:var(--accent);text-align:center;margin:2px 0 4px}
.pk-qty[readonly]{background:var(--accent-soft);font-weight:700}
.pk-total{font-size:1rem;text-align:center;padding-top:4px}
.pk-list{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:60vh;overflow:auto}
.pk-list input{margin-bottom:6px}
.pk-gh{background:var(--accent);color:var(--paper);font-weight:700;border-radius:8px;padding:4px 10px;margin:14px 0 4px}
.pk-gh:first-child{margin-top:0}
.pk-it{display:flex;justify-content:space-between;gap:8px;width:100%;background:none;border:0;border-bottom:1px dashed var(--line);padding:9px 6px;font:inherit;color:var(--ink);text-align:right;cursor:pointer}
.pk-it:active{background:var(--accent-soft)}
.pcard .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard[open] .clamp{display:none}
ul.ing{margin:4px 0;padding-inline-start:20px}
ul.ing li{padding-block:1px;border-bottom:1px dashed var(--line)}
label.switch{flex-direction:row;align-items:flex-start;gap:8px;color:var(--ink);font-weight:600}
label.switch input{width:auto;margin-top:6px;transform:scale(1.3)}
.rates{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:.92rem;line-height:1.6}
.profit{color:var(--good);font-weight:700;font-size:.85rem}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.money div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.85rem;color:var(--muted)}
.money b{display:block;font-size:1.15rem;color:var(--ink);font-variant-numeric:tabular-nums}
.money .pf b{color:var(--good)}
.period .filters{margin-bottom:8px}
.period input,.period select{max-width:220px}
.perhead{margin-top:8px;font-size:1rem}
.perhead span{display:block;font-family:var(--title);color:var(--accent);font-size:1.25rem;line-height:2}
.perhead b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.row .meta{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.chip{display:inline-block;border-radius:999px;padding:0 10px;font-size:.82rem;font-weight:700;white-space:nowrap}
.c-full{background:var(--good-bg);color:var(--good)}
.c-some{background:var(--mid-bg);color:var(--mid)}
.c-none{background:var(--bad-bg);color:var(--bad)}
.c-noc,.c-pending{background:var(--idle-bg);color:var(--idle)}
.sample{font-size:.75rem;color:var(--saffron);border:1px dashed var(--saffron);border-radius:6px;padding:0 6px;margin-inline-start:6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-family:var(--title);font-size:1.2rem;margin:0 0 6px;line-height:2.1;color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0}
dl.info dt{color:var(--muted);font-weight:600}
dl.info dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.entry{border-top:1px dashed var(--line);padding-block:8px;display:flex;justify-content:space-between;gap:10px}
.entry:first-of-type{border-top:0}
.entry .main{min-width:0;overflow-wrap:anywhere}
.date{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px}
.back{margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.3}
.meter{height:10px;border-radius:6px;background:var(--idle-bg);overflow:hidden;display:flex}
.meter span{display:block;height:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:2px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;text-align:center}
.scroll{overflow-x:auto}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);width:min(560px,calc(100vw - 24px));padding:0;direction:rtl}
dialog::backdrop{background:rgba(10,20,16,.5)}
dialog form{padding:16px;display:flex;flex-direction:column;gap:10px}
dialog h3{font-family:var(--title);margin:0;line-height:2.1;color:var(--accent)}
.actions{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 16px;border-radius:999px;font-weight:600;z-index:50}
.res-pick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.res-pick label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--ink)}
.res-pick input{width:auto}
.note{font-size:.88rem;color:var(--muted)}
.install{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.install img{width:40px;height:40px;border-radius:10px;flex:none}
.install .txt{flex:1;min-width:0;font-size:.9rem}
.install .txt b{display:block;color:var(--accent)}
.install .x{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:0 4px;line-height:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>مریضوں کا کھاتہ</h1>
      <p class="sub">مریض، دوائیں، علاج اور فالو اپ کا مکمل ریکارڈ</p>
    </div>
    <a href="/" class="btn ghost sm" style="text-decoration:none;white-space:nowrap;">🏠 علم جفر ہوم</a>
  </header>

  <div class="install" id="installBar" hidden>
    <img src="khata-icon-192.png" alt="">
    <div class="txt"><b>ایپ انسٹال کریں</b><span id="installHint">فون کی ہوم اسکرین پر لگائیں، انٹرنیٹ کے بغیر بھی چلے گی</span></div>
    <button class="btn sm" id="installBtn">انسٹال</button>
    <button class="x" id="installX" aria-label="بند کریں">×</button>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="patients" aria-selected="true">مریض</button>
    <button role="tab" data-tab="formulas" aria-selected="false">نسخے</button>
    <button role="tab" data-tab="report" aria-selected="false">رپورٹ</button>
  </nav>

  <main id="view"></main>
</div>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>

<script>
const KEY='mareez_khata_v1';
const RESULTS={full:'مکمل آرام آیا',some:'کچھ آرام آیا',none:'آرام نہیں آیا',noc:'رابطہ نہیں ہوا'};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>{if(!d)return'';const [y,m,dd]=d.split('-');return dd+'/'+m+'/'+y};

function seed(){
  const m1={id:uid(),name:'اکسیر ہاضم',type:'سفوف',benefits:'گیس، بدہضمی، پیٹ پھولنا، بھوک کی کمی',dose:'آدھا چمچ کھانے کے بعد پانی سے',cost:'200',price:'300',sample:true};
  const m2={id:uid(),name:'اعصابی ملین گولی',type:'گولی',benefits:'قبض، پیٹ کی گرانی',dose:'3 گولی رات سوتے وقت',cost:'150',price:'250',sample:true};
  const m3={id:uid(),name:'شربت بزوری',type:'شربت',benefits:'پیشاب کی جلن، گردے، ورم',dose:'2 چمچ دن میں دو بار',cost:'280',price:'400',sample:true};
  const p1={id:uid(),name:'محمد اسلم',phone:'0300-0000000',age:'45',gender:'مرد',address:'لاہور',diseases:'معدے کی گیس، قبض',symptoms:'کھانے کے بعد پیٹ پھولتا ہے، رات کو بے چینی',notes:'',created:today(),sample:true,
    given:[{id:uid(),date:today(),medId:m1.id,medName:m1.name,qty:'1 ڈبی',dose:m1.dose,days:'15',cost:'200',price:'300',note:''},{id:uid(),date:today(),medId:m2.id,medName:m2.name,qty:'45 گولی',dose:m2.dose,days:'15',cost:'150',price:'250',note:''}],
    followups:[{id:uid(),date:today(),result:'full',note:'گیس بالکل ختم، قبض بھی ٹھیک'}]};
  const p2={id:uid(),name:'شازیہ بی بی',phone:'0321-0000000',age:'38',gender:'عورت',address:'ملتان',diseases:'پیشاب کی جلن',symptoms:'پیشاب میں جلن، کمر میں ہلکا درد',notes:'',created:today(),sample:true,
    given:[{id:uid(),date:today(),medId:m3.id,medName:m3.name,qty:'1 بوتل',dose:m3.dose,days:'10',cost:'280',price:'400',note:''}],
    followups:[{id:uid(),date:today(),result:'some',note:'جلن کم ہے، درد باقی'}]};
  return {meds:[m1,m2,m3],patients:[p1,p2]};
}
let db;
let fresh=false;
function load(){try{const r=localStorage.getItem(KEY);fresh=!r;db=r?JSON.parse(r):seed()}catch(e){fresh=true;db=seed()}db.meds=db.meds||[];db.patients=db.patients||[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('محفوظ نہیں ہو سکا — براؤزر اسٹوریج بند ہے')}autoSnap()}

/* ---------- خودکار بیک اپ: ہر تبدیلی ایپ کے اندر دوسری جگہ (IndexedDB) بھی محفوظ، اور ہر دن کی کاپی ---------- */
let idbP=null;
function idb(){return idbP||(idbP=new Promise((ok,no)=>{const r=indexedDB.open('mareez_khata',1);r.onupgradeneeded=()=>r.result.createObjectStore('snaps');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
async function idbDo(mode,fn){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('snaps',mode);const r=fn(t.objectStore('snaps'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})}
const KEEP_DAYS=30;
let snapTimer;
function autoSnap(){clearTimeout(snapTimer);snapTimer=setTimeout(async()=>{try{
  const rec={ts:new Date().toISOString(),data:JSON.stringify(db),n:db.patients.length};
  await idbDo('readwrite',st=>{st.put(rec,'latest');st.put(rec,'day-'+today())});
  const days=(await idbDo('readonly',st=>st.getAllKeys())).filter(k=>String(k).startsWith('day-')).sort();
  if(days.length>KEEP_DAYS)await idbDo('readwrite',st=>days.slice(0,days.length-KEEP_DAYS).forEach(k=>st.delete(k)));
}catch(e){}},1200)}
function backupBlob(){return new Blob([JSON.stringify(db)],{type:'application/json'})}
function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(backupBlob());a.download='mareez-khata-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}
// روزانہ بیک اپ فائل (اختیاری): دن میں پہلی بار ایپ چھونے پر Downloads میں فائل
const AKEY='mareez_khata_autofile';
const autoFile=()=>{try{return JSON.parse(localStorage.getItem(AKEY))||{}}catch(e){return {}}};
const setAutoFile=v=>{try{localStorage.setItem(AKEY,JSON.stringify(v))}catch(e){}};
document.addEventListener('pointerdown',function daily(){
  const a=autoFile();if(a.on===false||a.last===today())return;
  if(!db.patients.some(p=>!p.sample))return;
  try{downloadBackup();setAutoFile({...a,last:today()});toast('آج کی بیک اپ فائل Downloads میں محفوظ ہو گئی')}catch(e){}
},true);
load();

if(fresh)idbDo('readonly',st=>st.get('latest')).then(r=>{if(r&&r.data){const d=JSON.parse(r.data);if(Array.isArray(d.patients)&&d.patients.length){db=d;db.meds=db.meds||[];save();render();toast('پچھلا ریکارڈ خودکار بیک اپ سے واپس آ گیا')}}else autoSnap()}).catch(()=>{});else autoSnap();

function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function status(p){const f=[...(p.followups||[])].sort((a,b)=>a.date<b.date?1:-1)[0];return f?f.result:'pending'}
function chip(r){return `<span class="chip c-${r}">${r==='pending'?'فالو اپ باقی':RESULTS[r]}</span>`}
const num=v=>parseFloat(v)||0;
const rs=n=>'Rs '+n.toLocaleString('en');
// منافع صرف ان اندراجات کا جن کا خرید ریٹ لکھا ہو
function money(given){let sale=0,cost=0,known=0;given.forEach(g=>{sale+=num(g.price);if(g.cost!==undefined&&g.cost!==''){cost+=num(g.cost);known+=num(g.price)}});return {sale,cost,profit:known-cost,hasCost:known>0||cost>0}}
function sampleTag(x){return x.sample?'<span class="sample">نمونہ</span>':''}

        ${given.length?given.map(g=>`<div class="med"><b>${esc(g.medName)}</b>${g.qty?' · '+esc(g.qty):''}${g.price?' · Rs '+esc(g.price):''}

const dlg=document.getElementById('dlg'),dform=document.getElementById('dlgForm');
function openDlg(html,onSave,onDelete){

function confirmBox(msg,yes){

  openDlg(`<h3>${p?'مریض کی تفصیل بدلیں':'نیا مریض'}</h3>
  <div class="grid2">
    <label class="full">مریض کا نام *<input name="name" id="f-name" required value="${esc(v.name)}"></label>

/* ---------- ادویات چننے کا ڈبہ: دوا/نسخہ چنیں، تعداد لکھیں، قیمت خود بنے ---------- */
function findItem(id){
  const m=db.meds.find(x=>x.id===id);if(m)return {id:m.id,name:m.name,cost:m.cost||'',price:m.price||'',dose:m.dose||'',formula:false,tablet:/گولی|کیپسول|ٹیبلٹ/.test(m.type||'')};
  const f=(db.formulas||[]).find(x=>x.id===id);if(f)return {id:f.id,name:f.name,cost:f.cost||'',price:f.price||'',dose:'',formula:true,tablet:true};
  return null;
}
// ترتیب: 1 نمبر سے 6 نمبر تک کے نسخے، آخر میں باقی دوائیں
function itemGroups(){
  const fs=[...(db.formulas||[])].sort(fOrder);
  const groups=['1','2','3','4','5','6'].map(k=>[`${k} نمبر · ${MIZAJ[k]}`,fs.filter(f=>f.mizaj===k).map(f=>[f.id,f.name,f.price])]);
  groups.push(['دیگر دوائیں',[...db.meds].sort((a,b)=>a.name.localeCompare(b.name,'ur')).map(m=>[m.id,m.name,m.price])]);
  const other=fs.filter(f=>!MIZAJ[f.mizaj]);if(other.length)groups.push(['دیگر نسخے',other.map(f=>[f.id,f.name,f.price])]);
  return groups.filter(g=>g[1].length);
}
function itemOptions(sel){
  return '<option value="">— دوا یا نسخہ چنیں —</option>'+itemGroups().map(([t,items])=>`<option disabled>──────────</option><optgroup label="◆ ${esc(t)}">${items.map(([id,n,pr])=>`<option value="${id}" ${sel===id?'selected':''}>${esc(n)}${pr?' — Rs '+esc(pr):''}</option>`).join('')}</optgroup>`).join('');
}
function pickerRows(){
  return [...document.querySelectorAll('#pk-rows .pk-row')].map(r=>{const it=findItem(r.dataset.id);if(!it)return null;
    const q=num(r.querySelector('.pk-qty').value)||0,u=num(r.querySelector('.pk-price').value);
    const sc=pkSchedule(r);
    if(sc){it.dose=sc.dose;it.days=sc.days}
    return {...it,qty:String(q),price:String(Math.round(q*u*100)/100),cost:it.cost!==''?String(Math.round(q*num(it.cost)*100)/100):''}}).filter(r=>r&&num(r.qty)>0);
}
// گولیوں کا حساب: ایک وقت میں کتنی × دن میں کتنی بار × کتنے دن = کل گولیاں (خود نہ لکھنا پڑے)
function pkSchedule(r){
  const s=r.querySelector('.pk-sched');if(!s)return null;
  const per=num(s.querySelector('.pk-per').value),times=num(s.querySelector('.pk-times').value),days=num(s.querySelector('.pk-days').value);
  const perTxt=per===0.5?'آدھی':String(per);
  return {per,times,days,total:Math.round(per*times*days*100)/100,dose:`${perTxt} گولی، دن میں ${times} بار (${['','صبح','صبح، شام','صبح، دوپہر، شام','ہر 6 گھنٹے بعد'][times]||''})`,days:String(days)};
}
function setupPicker(){
  const openB=document.getElementById('pk-open'),list=document.getElementById('pk-list'),qi=document.getElementById('pk-q'),box=document.getElementById('pk-items'),rows=document.getElementById('pk-rows'),tot=document.getElementById('pk-total');
  if(!openB)return;
  const draw=()=>{const q=qi.value.trim();
    box.innerHTML=itemGroups().map(([t,items])=>{const it=q?items.filter(x=>x[1].includes(q)):items;return it.length?`<div class="pk-gh">${esc(t)}</div>${it.map(([id,n,pr])=>`<button type="button" class="pk-it" data-pick="${id}"><span>${esc(n)}</span><span class="meta">${pr?'Rs '+esc(pr):''}</span></button>`).join('')}`:''}).join('')||'<div class="note" style="padding:8px">کچھ نہیں ملا</div>';
    box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{add(b.dataset.pick);list.hidden=true;openB.hidden=false;qi.value=''})};
  openB.onclick=()=>{list.hidden=false;openB.hidden=true;draw();qi.focus()};
  qi.oninput=draw;
  const update=()=>{let sale=0,cost=0,hasCost=false;
    rows.querySelectorAll('.pk-row').forEach(r=>{const sc=pkSchedule(r);if(sc){r.querySelector('.pk-qty').value=sc.total;r.querySelector('.pk-sum').innerHTML=`کل <b>${sc.total}</b> گولیاں = ${sc.per===0.5?'آدھی':sc.per} × ${sc.times} بار × ${sc.days} دن`}
      const it=findItem(r.dataset.id);const q=num(r.querySelector('.pk-qty').value),u=num(r.querySelector('.pk-price').value);r.querySelector('.pk-line').textContent=rs(Math.round(q*u*100)/100);sale+=q*u;if(it&&it.cost!==''){cost+=q*num(it.cost);hasCost=true}});
    sale=Math.round(sale*100)/100;cost=Math.round(cost*100)/100;
    tot.hidden=!rows.children.length;
    tot.innerHTML=`کل رقم: <b>${rs(sale)}</b>${hasCost?` · خرید ${rs(cost)} · <span class="profit">منافع ${rs(Math.round((sale-cost)*100)/100)}</span>`:''}`};
  const add=id=>{const it=findItem(id);if(!it)return;
    const ex=rows.querySelector(`[data-id="${it.id}"]`);if(ex){if(!ex.querySelector('.pk-sched')){const q=ex.querySelector('.pk-qty');q.value=num(q.value)+1}update();ex.scrollIntoView({block:'center'});return}
    const r=document.createElement('div');r.className='pk-row';r.dataset.id=it.id;
    const opt=(arr,def,lab)=>arr.map(v=>`<option value="${v}" ${v===def?'selected':''}>${lab(v)}</option>`).join('');
    const sched=it.tablet?`<div class="pk-sched">
        <label>ایک وقت میں<select class="pk-per">${opt([0.5,1,2,3,4],1,v=>v===0.5?'آدھی گولی':v+' گولی')}</select></label>
        <label>دن میں<select class="pk-times">${opt([1,2,3,4],3,v=>v+' بار')}</select></label>
        <label>کتنے دن<select class="pk-days">${opt([1,2,3,5,7,10,14,15,20,21,30,45,60,90],3,v=>v+' دن')}</select></label>
      </div><div class="pk-sum"></div>`:'';
    r.innerHTML=`<div class="pk-name"><b>${esc(it.name)}</b><button type="button" class="x" aria-label="ہٹائیں">×</button></div>${sched}
      <div class="pk-calc"><label>${it.tablet?'کل گولیاں':'تعداد'}<input class="pk-qty" type="number" min="0" step="any" inputmode="decimal" value="1"></label><span>×</span><label>${it.tablet?'فی گولی':'ریٹ'}<input class="pk-price" type="number" min="0" step="any" inputmode="decimal" value="${esc(it.price)}" placeholder="0"></label><span>=</span><b class="pk-line"></b></div>`;
    r.querySelector('.x').onclick=()=>{r.remove();update()};
    r.querySelectorAll('input').forEach(i=>i.oninput=update);

function givenForm(p,g){
  const v=g||{date:today()};

  <div class="grid2">
    <label class="full">دوا<select name="medId" id="g-med">${medOptions(v.medId||(g?'__other':''))}</select></label>
    <label class="full" id="g-other-wrap" ${v.medId||!g?'hidden':''}>دوا کا نام<input name="medName" id="g-name" value="${esc(v.medName)}"></label>
    <label>تاریخ<input type="date" name="date" id="g-date" value="${esc(v.date)}"></label>
    <label>مقدار<input name="qty" id="g-qty" placeholder="مثلاً 1 ڈبی، 30 گولی" value="${esc(v.qty)}"></label>
    <label class="full">کھانے کا طریقہ / خوراک<input name="dose" id="g-dose" value="${esc(v.dose)}"></label>

    <label>خرید ریٹ (جو ملا)<input name="cost" id="g-cost" inputmode="numeric" value="${esc(v.cost)}"></label>
    <label class="full">نوٹ<textarea name="note" id="g-note">${esc(v.note)}</textarea></label>
  </div>`,fd=>{
    let medName=fd.medName;
    if(fd.medId&&fd.medId!=='__other'){const m=findItem(fd.medId);medName=m?m.name:medName}else fd.medId='';
    if(!medName||!medName.trim()){toast('دوا چنیں یا نام لکھیں');return false}
    // نئی دوا کا نام لکھا ہو تو اسے دواؤں کی فہرست میں بھی ڈال دیں
    if(!fd.medId){const ex=db.meds.find(m=>m.name.trim()===medName.trim());if(ex)fd.medId=ex.id;else{const m={id:uid(),name:medName.trim(),type:'',benefits:'',dose:fd.dose||'',cost:fd.cost||'',price:fd.price||''};db.meds.push(m);fd.medId=m.id}}
    const rec={...fd,medName};
    if(g)Object.assign(g,rec);else p.given.push({id:uid(),...rec});
    delete p.sample;save();toast('دوا درج ہو گئی');
  },g?()=>confirmBox('یہ دوا کا اندراج حذف ہو جائے گا۔',()=>{p.given=p.given.filter(x=>x.id!==g.id);save();render()}):null);

  sel.onchange=()=>{
    wrap.hidden=sel.value!=='__other';

    if(m){document.getElementById('g-dose').value=m.dose||'';document.getElementById('g-price').value=m.price||'';document.getElementById('g-cost').value=m.cost||'';document.getElementById('g-name').value=m.name}

/* ---------- medicines ---------- */
function renderMeds(){
  const q=state.mq.trim();
  let list=[...db.meds].sort((a,b)=>a.name.localeCompare(b.name,'ur'));
  if(q)list=list.filter(m=>[m.name,m.benefits,m.type].join(' ').includes(q));
  const used=id=>db.patients.filter(p=>(p.given||[]).some(g=>g.medId===id)).length;
  view.innerHTML=`
  <button class="btn ghost sm back" id="backM">→ تمام مریض</button>
  <div class="bar">
    <input type="search" id="mq" placeholder="دوا یا بیماری سے تلاش کریں" value="${esc(state.mq)}">
    <button class="btn" id="addM">+ نئی دوا</button>
  </div>
  <div class="list">${list.length?list.map(m=>`
    <div class="row" tabindex="0" data-id="${m.id}">
      <div class="main">
        <div class="name">${esc(m.name)}${sampleTag(m)} ${m.type?`<span class="meta">(${esc(m.type)})</span>`:''}</div>
        ${m.benefits?`<div class="meta">فوائد: ${esc(m.benefits)}</div>`:''}
        ${m.dose?`<div class="meta">خوراک: ${esc(m.dose)}</div>`:''}
      </div>
      <div class="rates">
        <div><span class="meta">خرید</span> ${m.cost?esc(m.cost):'—'}</div>
        <div><span class="meta">فروخت</span> <b>${m.price?esc(m.price):'—'}</b></div>
        ${m.cost&&m.price?`<div class="profit">منافع ${rs(num(m.price)-num(m.cost))}</div>`:''}
        <div class="meta">${used(m.id)} مریض</div>
      </div>
    </div>`).join(''):`<div class="empty">${q?'کوئی دوا نہیں ملی':'ابھی کوئی دوا درج نہیں'}</div>`}
  </div>`;
  const mq=document.getElementById('mq');
  mq.oninput=()=>{state.mq=mq.value;const pos=mq.selectionStart;renderMeds();const n=document.getElementById('mq');n.focus();n.setSelectionRange(pos,pos)};
  document.getElementById('backM').onclick=()=>{state.tab='patients';render()};
  document.getElementById('addM').onclick=()=>medForm();
  view.querySelectorAll('.row').forEach(r=>{const go=()=>medForm(db.meds.find(m=>m.id===r.dataset.id));r.onclick=go;r.onkeydown=e=>{if(e.key==='Enter')go()}});
}

        ${ing.length?`<ul class="ing">${ing.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="note">اجزا درج نہیں</div>'}
        ${sec('فوائد',f.benefits)}${sec('تیاری',f.prep)}${sec('خوراک / طریقہ',f.dose)}${sec('نوٹ',f.notes)}
        <div class="sec">ایک گولی کی قیمت (روپے)</div>
        <div class="grid2" style="margin-top:4px">
          <label>خرید ریٹ<input inputmode="decimal" data-cost="${f.id}" value="${esc(f.cost)}" placeholder="مثلاً 5"></label>
          <label>فروخت ریٹ<input inputmode="decimal" data-price="${f.id}" value="${esc(f.price)}" placeholder="مثلاً 10"></label>
        </div>
        <div class="actions" style="margin-top:6px"><button class="btn sm" data-psave="${f.id}">قیمت محفوظ کریں</button></div>
        <div class="actions" style="margin-top:10px"><button class="btn ghost sm" data-fedit="${f.id}">نسخہ بدلیں</button></div>
      </div>
    </details>`;
}
function renderFormulas(){
  const q=state.fq.trim();
  let list=[...db.formulas].sort((a,b)=>(a.mizaj||'9').localeCompare(b.mizaj||'9')||fOrder(a,b));
  if(state.fm!=='all')list=list.filter(f=>f.mizaj===state.fm);
  if(q)list=list.filter(f=>[f.name,f.ingredients,f.benefits,f.notes].join(' ').includes(q));
  view.innerHTML=`
  <div class="bar">
    <input type="search" id="fq" placeholder="نسخہ، جز یا بیماری سے تلاش کریں" value="${esc(state.fq)}">
    <button class="btn" id="addF2">+ نیا نسخہ</button>
  </div>
  <div class="filters">${['all','1','2','3','4','5','6'].map(k=>`<button data-fm="${k}" aria-pressed="${state.fm===k}">${k==='all'?'سب':k+' نمبر'}</button>`).join('')}</div>
  ${state.fm!=='all'?`<p class="note">${mzLabel(state.fm)}</p>`:''}
  <div class="list">${list.length?list.map(formulaCard).join(''):`<div class="empty">${q?'کوئی نسخہ نہیں ملا':'اس نمبر میں ابھی کوئی نسخہ نہیں'}</div>`}</div>`;
  const fq=document.getElementById('fq');
  fq.oninput=()=>{state.fq=fq.value;const pos=fq.selectionStart;renderFormulas();const n=document.getElementById('fq');n.focus();n.setSelectionRange(pos,pos)};
  document.getElementById('addF2').onclick=()=>formulaForm();
  view.querySelectorAll('[data-fm]').forEach(b=>b.onclick=()=>{state.fm=b.dataset.fm;renderFormulas()});
  view.querySelectorAll('.pcard').forEach(d=>d.ontoggle=()=>{d.open?state.open.add(d.dataset.id):state.open.delete(d.dataset.id)});
  view.querySelectorAll('[data-psave]').forEach(b=>b.onclick=()=>{const f=db.formulas.find(x=>x.id===b.dataset.psave);f.cost=view.querySelector(`[data-cost="${f.id}"]`).value.trim();f.price=view.querySelector(`[data-price="${f.id}"]`).value.trim();save();toast('قیمت محفوظ ہو گئی');renderFormulas()});
  view.querySelectorAll('[data-fedit]').forEach(b=>b.onclick=()=>formulaForm(db.formulas.find(x=>x.id===b.dataset.fedit)));
}
function formulaForm(f){
  const v=f||{mizaj:state.fm!=='all'?state.fm:'2'};
  openDlg(`<h3>${f?'نسخہ بدلیں':'نیا نسخہ'}</h3>
  <div class="grid2">
    <label class="full">نسخے کا نام *<input name="name" id="x-name" required value="${esc(v.name)}"></label>
    <label>مزاج نمبر<select name="mizaj" id="x-mizaj">${Object.entries(MIZAJ).map(([k,t])=>`<option value="${k}" ${v.mizaj===k?'selected':''}>${k} نمبر — ${t}</option>`).join('')}</select></label>
    <label>ایک گولی — خرید ریٹ<input name="cost" id="x-cost" inputmode="decimal" value="${esc(v.cost)}"></label>
    <label>ایک گولی — فروخت ریٹ<input name="price" id="x-price" inputmode="decimal" value="${esc(v.price)}"></label>
    <label class="full">اجزا (ہر جز الگ لائن میں)<textarea name="ingredients" id="x-ing" style="min-height:120px" placeholder="کرنجوہ 1 تولہ">${esc(v.ingredients)}</textarea></label>
    <label class="full">فوائد / کن بیماریوں میں<textarea name="benefits" id="x-ben">${esc(v.benefits)}</textarea></label>
    <label class="full">تیاری<textarea name="prep" id="x-prep">${esc(v.prep)}</textarea></label>
    <label class="full">خوراک / طریقہ<textarea name="dose" id="x-dose">${esc(v.dose)}</textarea></label>
    <label class="full">نوٹ<textarea name="notes" id="x-notes">${esc(v.notes)}</textarea></label>
  </div>`,fd=>{
    if(!fd.name.trim()){toast('نسخے کا نام لکھیں');return false}
    if(f)Object.assign(f,fd);else{const n={id:uid(),...fd};db.formulas.push(n);state.open.add(n.id)}
    save();toast('نسخہ محفوظ ہو گیا');
  },f?()=>confirmBox(`"${f.name}" کا نسخہ حذف ہو جائے گا۔`,()=>{db.formulas=db.formulas.filter(x=>x.id!==f.id);save();render()}):null);
}

/* ---------- report ---------- */
function renderReport(){
  const keys=['full','some','none','pending'];
  const cnt={full:0,some:0,none:0,noc:0,pending:0};
  // مدت: سب / مہینہ / سال — اس مدت میں جن مریضوں کو دوا دی گئی
  const MONTHS=['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
  const pre=state.per==='month'?state.month:state.per==='year'?state.year:'';
  const inPer=d=>!pre||(d||'').startsWith(pre);
  const pats=pre?db.patients.filter(p=>(p.given||[]).some(g=>inPer(g.date))):db.patients;
  pats.forEach(p=>cnt[status(p)]++);
  const tot=pats.length||1;
  const perLabel=state.per==='month'?(MONTHS[+state.month.slice(5)-1]||'')+' '+state.month.slice(0,4):state.per==='year'?'سال '+state.year:'شروع سے اب تک';
  const years=[...new Set([today().slice(0,4),...db.patients.flatMap(p=>(p.given||[]).map(g=>(g.date||'').slice(0,4)))].filter(Boolean))].sort().reverse();
  // سال چنا ہو تو ہر مہینے کا حساب
  const monthRows=state.per==='year'?MONTHS.map((n,i)=>{const mp=state.year+'-'+String(i+1).padStart(2,'0');const ps=db.patients.filter(p=>(p.given||[]).some(g=>(g.date||'').startsWith(mp)));const c={full:0,some:0,none:0,other:0};ps.forEach(p=>{const s=status(p);if(c[s]!==undefined)c[s]++;else c.other++});const m=money(db.patients.flatMap(p=>(p.given||[]).filter(g=>(g.date||'').startsWith(mp))));return {n,count:ps.length,c,m}}):[];
  const colors={full:'var(--good)',some:'var(--mid)',none:'var(--bad)',noc:'var(--idle)',pending:'var(--idle)'};
  const label=k=>k==='pending'?'فالو اپ باقی':RESULTS[k];
  let list=pats.filter(p=>state.filter==='all'||status(p)===state.filter||(state.filter==='pending'&&status(p)==='noc'));
  // medicine effectiveness
  const medStats={};
  pats.forEach(p=>{const s=status(p);const names=new Set((p.given||[]).filter(g=>inPer(g.date)).map(g=>g.medName));names.forEach(n=>{medStats[n]=medStats[n]||{full:0,some:0,none:0,other:0};if(s==='full'||s==='some'||s==='none')medStats[n][s]++;else medStats[n].other++})});
  const medRows=Object.entries(medStats).sort((a,b)=>(b[1].full+b[1].some)-(a[1].full+a[1].some));
  const allGiven=db.patients.flatMap(p=>(p.given||[]).filter(g=>inPer(g.date)));const mny=money(allGiven);
  view.innerHTML=`
  <div class="card period">
    <div class="filters">${[['month','مہینہ'],['year','سال'],['all','سب']].map(([k,t])=>`<button data-per="${k}" aria-pressed="${state.per===k}">${t}</button>`).join('')}</div>
    ${state.per==='month'?`<input type="month" id="perMonth" value="${state.month}">`:''}
    ${state.per==='year'?`<select id="perYear">${years.map(y=>`<option ${y===state.year?'selected':''}>${y}</option>`).join('')}</select>`:''}
    <div class="perhead"><span>${perLabel}</span><b>${pats.length}</b> مریضوں نے دوا لی · <b style="color:var(--good)">${cnt.full+cnt.some}</b> کو آرام آیا</div>
  </div>
  <div class="money">
    <div>کل فروخت<b>${rs(mny.sale)}</b></div>
    <div>کل خرید<b>${rs(mny.cost)}</b></div>
    <div class="pf">کل منافع<b>${rs(mny.profit)}</b></div>
  </div>
  <div class="stats">
    ${keys.map(k=>`<div class="stat c-${k}"><b>${k==='pending'?cnt.pending+cnt.noc:cnt[k]}</b>${label(k)}</div>`).join('')}
  </div>
  <div class="meter" aria-label="نتائج کا تناسب">${['full','some','none'].map(k=>`<span style="width:${cnt[k]/tot*100}%;background:${colors[k]}"></span>`).join('')}</div>
  <p class="note">${perLabel}: ${pats.length} مریض · ہر مریض کا آخری رابطہ گنا گیا ہے</p>
${state.per==='year'?`
  <div class="card">
    <h2><span>${esc(state.year)} — مہینہ وار</span></h2>
    <div class="scroll"><table><thead><tr><th>مہینہ</th><th>مریض</th><th>مکمل آرام</th><th>کچھ آرام</th><th>آرام نہیں</th><th>باقی</th><th>فروخت</th><th>منافع</th></tr></thead><tbody>
    ${monthRows.map(r=>`<tr${r.count?'':' style="color:var(--muted)"'}><td>${r.n}</td><td class="n"><b>${r.count}</b></td><td class="n" style="color:var(--good)">${r.c.full}</td><td class="n" style="color:var(--mid)">${r.c.some}</td><td class="n" style="color:var(--bad)">${r.c.none}</td><td class="n">${r.c.other}</td><td class="n">${r.m.sale.toLocaleString('en')}</td><td class="n" style="color:var(--good)">${r.m.profit.toLocaleString('en')}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`:''}

  <div class="card">
    <h2><span>مریض بلحاظ نتیجہ</span></h2>
    <div class="filters">${['all',...keys].map(k=>`<button data-f="${k}" aria-pressed="${state.filter===k}">${k==='all'?'سب':label(k)}</button>`).join('')}</div>
    <div class="list">${list.length?list.map(p=>{const f=[...p.followups].sort((a,b)=>b.date.localeCompare(a.date))[0];return `
      <div class="row" tabindex="0" data-id="${p.id}"><div class="main">
        <div class="name">${esc(p.name)}${sampleTag(p)}</div>
        <div class="meta">${esc(p.diseases||'')}</div>
        <div class="meta">دوا: ${esc([...new Set(p.given.map(g=>g.medName))].join('، ')||'—')}</div>
        ${f&&f.note?`<div class="meta">"${esc(f.note)}" · ${fmtDate(f.date)}</div>`:''}
      </div>${chip(status(p))}</div>`}).join(''):'<div class="empty">اس حصے میں کوئی مریض نہیں</div>'}</div>
  </div>

  <div class="card">
    <h2><span>کس دوا سے کتنوں کو آرام آیا</span></h2>
    ${medRows.length?`<div class="scroll"><table><thead><tr><th>دوا</th><th>مکمل آرام</th><th>کچھ آرام</th><th>آرام نہیں</th><th>باقی</th></tr></thead><tbody>
    ${medRows.map(([n,s])=>`<tr><td>${esc(n)}</td><td class="n" style="color:var(--good)">${s.full}</td><td class="n" style="color:var(--mid)">${s.some}</td><td class="n" style="color:var(--bad)">${s.none}</td><td class="n">${s.other}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">ابھی کسی مریض کو دوا نہیں دی گئی</div>'}
  </div>
  <p class="note" style="text-align:center;margin-top:18px"><button class="btn ghost sm" id="goBk">بیک اپ فائل لیں / واپس لائیں</button></p>`;
  view.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.f;renderReport()});
  document.getElementById('goBk').onclick=()=>{state.tab='backup';render()};
  view.querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{state.per=b.dataset.per;renderReport()});
  const pm=document.getElementById('perMonth');if(pm)pm.onchange=()=>{if(pm.value){state.month=pm.value;renderReport()}};
  const py=document.getElementById('perYear');if(py)py.onchange=()=>{state.year=py.value;renderReport()};
  view.querySelectorAll('.row').forEach(r=>{const go=()=>{state.tab='patients';state.patientId=r.dataset.id;render()};r.onclick=go;r.onkeydown=e=>{if(e.key==='Enter')go()}});
}

/* ---------- backup ---------- */
function renderBackup(){
  const hasSample=db.meds.some(m=>m.sample)||db.patients.some(p=>p.sample);
  view.innerHTML=`
  <button class="btn ghost sm back" id="backR">→ رپورٹ</button>
  <div class="card">
    <h2><span>بیک اپ لیں</span></h2>
    <div class="actions">
      <button class="btn" id="dl">بیک اپ فائل ڈاؤن لوڈ کریں</button>
      <button class="btn ghost" id="sh">Drive / واٹس ایپ پر بھیجیں</button>
      <button class="btn ghost" id="cp">بیک اپ کاپی کریں</button>
    </div>
    <p class="note">کاپی کیا ہوا متن واٹس ایپ پر خود کو بھیج کر بھی محفوظ کر سکتے ہیں۔</p>
    <textarea id="bk" readonly style="min-height:90px;direction:ltr;font-size:.75rem" hidden></textarea>
  </div>
  <div class="card">
    <h2><span>بیک اپ واپس لائیں</span></h2>
    <label>بیک اپ فائل چنیں<input type="file" id="fi" accept=".json,application/json,text/plain"></label>
    <label style="margin-top:8px">یا بیک اپ متن یہاں پیسٹ کریں<textarea id="pastebk" style="direction:ltr;font-size:.75rem"></textarea></label>
    <div class="actions" style="margin-top:8px"><button class="btn" id="restore">بیک اپ واپس لائیں</button></div>
    <p class="note">موجودہ ڈیٹا کی جگہ بیک اپ والا ڈیٹا آ جائے گا۔</p>
  </div>
  ${hasSample?`<div class="card"><h2><span>نمونہ ریکارڈ</span></h2><p>شروع میں سمجھانے کے لیے کچھ نمونہ مریض اور دوائیں ڈالی گئی ہیں۔</p><button class="btn danger" id="clrS">نمونہ ریکارڈ ہٹائیں</button></div>`:''}`;
  document.getElementById('backR').onclick=()=>{state.tab='report';render()};
  const json=()=>JSON.stringify(db);
  document.getElementById('dl').onclick=()=>{try{downloadBackup();toast('بیک اپ فائل بن گئی')}catch(e){toast('ڈاؤن لوڈ نہیں ہوا — کاپی والا طریقہ استعمال کریں')}};
  document.getElementById('sh').onclick=async()=>{const f=new File([backupBlob()],'mareez-khata-'+today()+'.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'مریضوں کا کھاتہ — بیک اپ'})}catch(e){}}else{downloadBackup();toast('یہ فون شیئر نہیں کرتا — فائل ڈاؤن لوڈ ہو گئی')}};
  const restore=txt=>{try{const d=JSON.parse(txt);if(!Array.isArray(d.patients)||!Array.isArray(d.meds))throw 0;confirmBox('موجودہ سارا ڈیٹا بیک اپ سے بدل جائے گا۔',()=>{db=d;save();toast('بیک اپ واپس آ گیا');state.tab='patients';render()})}catch(e){toast('یہ درست بیک اپ نہیں ہے')}};
  document.getElementById('restore').onclick=()=>{const f=document.getElementById('fi').files[0];const t=document.getElementById('pastebk').value.trim();if(f){const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f)}else if(t)restore(t);else toast('پہلے فائل چنیں یا متن پیسٹ کریں')};
  const c=document.getElementById('clrS');if(c)c.onclick=()=>confirmBox('تمام نمونہ مریض اور نمونہ دوائیں حذف ہو جائیں گی۔ آپ کا اپنا ریکارڈ رہے گا۔',()=>{db.meds=db.meds.filter(m=>!m.sample);db.patients=db.patients.filter(p=>!p.sample);save();render();toast('نمونہ ریکارڈ ہٹ گیا')});
}

render();

/* ---------- ایپ انسٹال ---------- */
(function(){
  const bar=document.getElementById('installBar'),btn=document.getElementById('installBtn'),hint=document.getElementById('installHint');
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const DKEY='mareez_khata_install_hidden';
  const dismissed=()=>{try{return Date.now()-(+localStorage.getItem(DKEY)||0)<7*864e5}catch(e){return false}};
  let deferred=null;
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  // انسٹال ایپ میں براؤزر ڈیٹا خود سے نہ مٹائے
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if(standalone) return;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;btn.hidden=false;if(!dismissed())bar.hidden=false});
  btn.onclick=async()=>{
    if(!deferred){toast('براؤزر کے مینو ⋮ سے "Add to Home screen" دبائیں');return}
    deferred.prompt();const r=await deferred.userChoice;deferred=null;
    if(r.outcome==='accepted')bar.hidden=true;
  };
  document.getElementById('installX').onclick=()=>{bar.hidden=true;try{localStorage.setItem(DKEY,Date.now())}catch(e){}};
  window.addEventListener('appinstalled',()=>{bar.hidden=true;toast('ایپ انسٹال ہو گئی — ہوم اسکرین سے کھولیں')});
  // آئی فون پر خودکار انسٹال نہیں، طریقہ بتائیں
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!dismissed()){
    hint.textContent='نیچے Share ⬆️ دبائیں، پھر "Add to Home Screen" چنیں';btn.hidden=true;bar.hidden=false;
  }
})();
</script>
