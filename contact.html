<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Ilm-e-Jafar</title>
<meta name="description" content="Contact ilmejafar.com with your questions, feedback, or suggestions.">
<style>
:root{--gold:#c9a84c;--gold-light:#e8c87a;--gold-dark:#9a7830;--cream:#faf7f0;}
*{box-sizing:border-box;}
body{margin:0;background:#0d1c38;background-image:radial-gradient(ellipse 120% 70% at 50% 0%,rgba(201,168,76,.10) 0%,transparent 60%),linear-gradient(180deg,#16294f 0%,#0d1c38 45%,#0a1628 100%);font-family:Georgia,'Times New Roman',serif;color:var(--cream);min-height:100vh;line-height:1.8;}
.wrap{max-width:600px;margin:0 auto;padding:28px 20px 60px;}
.topnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
.topnav a{color:var(--gold);text-decoration:none;font-weight:700;font-size:14px;}
.topnav a:hover{color:var(--gold-light);}
h1{font-size:clamp(26px,5vw,36px);background:linear-gradient(135deg,#f0d878 0%,var(--gold) 40%,var(--gold-dark) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
.subtitle{color:rgba(250,247,240,.65);font-size:15px;margin-bottom:28px;}
label{display:block;color:var(--gold-light);font-size:14px;font-weight:700;margin-bottom:6px;margin-top:18px;}
input, textarea{width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(201,168,76,.3);background:rgba(255,255,255,.05);color:var(--cream);font-family:inherit;font-size:15px;}
input:focus, textarea:focus{outline:none;border-color:var(--gold);}
textarea{min-height:140px;resize:vertical;}
button{margin-top:24px;width:100%;padding:14px 0;background:linear-gradient(135deg,#e8c87a,#c9a84c,#9a7830);color:#0a1628;font-weight:700;font-size:16px;border:none;border-radius:10px;cursor:pointer;}
button:hover{opacity:.92;}
button:disabled{opacity:.6;cursor:not-allowed;}
.status{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:14px;display:none;}
.status.success{display:block;background:rgba(60,160,90,.15);border:1px solid rgba(60,200,110,.4);color:#a6e8bd;}
.status.error{display:block;background:rgba(160,60,60,.15);border:1px solid rgba(220,90,90,.4);color:#f3a6a6;}
.footer-links{margin-top:44px;padding-top:20px;border-top:1px solid rgba(201,168,76,.2);text-align:center;font-size:13px;}
.footer-links a{color:var(--gold);text-decoration:none;margin:0 6px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topnav">
    <a href="/">🏠 Home</a>
  </div>

  <h1>Contact Us</h1>
  <div class="subtitle">Have a question, feedback, or a suggestion? Send us a message below.</div>

  <form id="contactForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit" id="submitBtn">Send Message</button>

    <div class="status success" id="successMsg">✅ Thank you! Your message has been sent successfully.</div>
    <div class="status error" id="errorMsg">⚠️ Something went wrong. Please try again, or email us directly.</div>
  </form>

  <div class="footer-links">
    <a href="/">Home</a> | <a href="/about.html">About</a> | <a href="/privacy.html">Privacy Policy</a>
    <br><br>&copy; 2026 ilmejafar.com
  </div>

</div>

<script>
var form = document.getElementById('contactForm');
var btn = document.getElementById('submitBtn');
var successMsg = document.getElementById('successMsg');
var errorMsg = document.getElementById('errorMsg');

form.addEventListener('submit', function(e){
  e.preventDefault();
  successMsg.style.display = 'none';
  errorMsg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Sending...';

  var data = new FormData(form);

  fetch('https://formspree.io/f/xgogpgea', {
    method: 'POST',
    body: data,
    headers: { 'Accept': 'application/json' }
  }).then(function(response){
    if (response.ok) {
      successMsg.style.display = 'block';
      form.reset();
    } else {
      response.json().then(function(data){
        console.error('Formspree error:', data);
        errorMsg.style.display = 'block';
      }).catch(function(){
        errorMsg.style.display = 'block';
      });
    }
  }).catch(function(err){
    console.error('Network error:', err);
    errorMsg.style.display = 'block';
  }).finally(function(){
    btn.disabled = false;
    btn.textContent = 'Send Message';
  });
});
</script>

</body>
</html>
